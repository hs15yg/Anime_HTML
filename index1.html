<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Naruto Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🍥 Mundo de Naruto</h1>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="contenedor">

        <!-- TARJETAS -->
        <div class="card naruto">
            <img src="naruto.jfif" height="320" width="320">
            <h2>Naruto Uzumaki</h2>
        </div>

        <div class="card sasuke">
            <img src="sasuke.webp" height="320" width="320">
            <h2>Sasuke Uchiha</h2>
        </div>

        <div class="card sakura">
            <img src="sakura.webp" height="320" width="320">
            <h2>Sakura Haruno</h2>
        </div>

        <div class="card kakashi">
            <img src="kakashi.webp" height="320" width="320">
            <h2>Kakashi Hatake</h2>
        </div>

    </div>

    <h2>Direcciones Flex</h2>

    <!-- SEGUNDO CONTENEDOR -->
    <div class="direcciones">
        <div class="box">🍥</div>
        <div class="box">🔥</div>
        <div class="box">⚡</div>
    </div>

</body>
</html>
